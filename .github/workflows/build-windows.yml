name: Build Windows EXE

# Builds a standalone RivalsRadio.exe on a Windows runner so you can just
# download it — no local Python or terminal needed.
#
# - Runs on pushes to the dev branch and on version tags (v1.0.0, ...).
# - Can also be triggered manually from the Actions tab (Run workflow).
# - The exe is uploaded as a build artifact; tagged builds also create a Release.

on:
  push:
    branches:
      - claude/lucid-dijkstra-dgid0f
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: pyinstaller --noconfirm RivalsRadio.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RivalsRadio-windows
          path: dist/RivalsRadio.exe

      - name: Attach to release (tagged builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RivalsRadio.exe
