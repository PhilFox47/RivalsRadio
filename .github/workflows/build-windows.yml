name: Build Windows EXE

# Builds the standalone RivalsRadio bundle:
#   RivalsRadio.exe   the app (PyInstaller, assets + default roster included)
#   overwolf-app/     the native Overwolf companion (load unpacked in Overwolf)
#
# Runs on pushes to the dev branch; a manual run with a release_version input
# (e.g. v0.6.0) also publishes a GitHub Release.

on:
  push:
    branches:
      - claude/lucid-dijkstra-dgid0f
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Publish a Release with this tag (e.g. v0.6.0). Blank = just build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build RivalsRadio.exe
        run: pyinstaller --noconfirm RivalsRadio.spec

      - name: Assemble bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundle | Out-Null
          Copy-Item dist/RivalsRadio.exe bundle/
          Copy-Item overwolf-app bundle/overwolf-app -Recurse
          Compress-Archive -Path bundle/* -DestinationPath RivalsRadio-windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RivalsRadio-windows
          path: RivalsRadio-windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_version != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_version || github.ref_name }}
          name: RivalsRadio ${{ github.event.inputs.release_version || github.ref_name }}
          files: RivalsRadio-windows.zip
          generate_release_notes: true
          body: |
            **RivalsRadio for Windows** — download `RivalsRadio-windows.zip`,
            unzip keeping the folder intact, run `RivalsRadio.exe`.

            Ships with the full hero roster + art. For automatic hero
            detection, load `overwolf-app/` unpacked in Overwolf (dev mode)
            and launch it. Manual switching works without it.
